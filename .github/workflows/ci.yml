name: CI

# Builds the greeter (its meson tests run as part of the build) and the
# demo that runs it with a fake greetd.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build and unit-test the greeter
        run: nix build -L .#default
      - name: Build the demo app
        run: nix build -L --no-link .#apps.x86_64-linux.default.program
